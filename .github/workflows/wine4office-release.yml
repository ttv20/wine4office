name: Build Wine4Office release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (blank uses the commit)"
        required: false
        type: string
      metadata_url:
        description: "Canonical HTTPS release.json URL"
        required: false
        type: string
      release_base_url:
        description: "HTTPS artifact base URL, or a path relative to release.json"
        required: false
        type: string
      channel:
        description: "Release channel"
        required: false
        type: string
  push:
    tags:
      - "wine4office-v*"
      - "0.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: wine4office-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 360
    env:
      CONFIGURED_METADATA_URL: ${{ inputs.metadata_url || vars.WINE4OFFICE_METADATA_URL || 'https://github.com/ttv20/wine4office/releases/latest/download/release.json' }}
      CONFIGURED_RELEASE_BASE_URL: ${{ inputs.release_base_url || vars.WINE4OFFICE_RELEASE_BASE_URL || 'https://github.com/ttv20/wine4office/releases/latest/download' }}
      REQUESTED_RELEASE_CHANNEL: ${{ inputs.channel }}
      DEFAULT_RELEASE_CHANNEL: ${{ vars.WINE4OFFICE_RELEASE_CHANNEL || 'stable' }}
    steps:
      - name: Check out Wine4Office
        uses: actions/checkout@v4

      - name: Verify release orchestration environment
        shell: bash
        run: |
          set -euo pipefail
          required=(curl docker gh python3 tar zstd)
          missing=()
          for command in "${required[@]}"; do
            command -v "$command" >/dev/null || missing+=("$command")
          done
          if ((${#missing[@]})); then
            printf 'Missing runner dependency: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "Runner: $(uname -a)"
          docker version
          df -h .

      - name: Select release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          requested=${REQUESTED_VERSION:-}
          tagged_release=false
          if [[ -n "$requested" ]]; then
            version=$requested
          elif [[ $GITHUB_REF == refs/tags/wine4office-v* ]]; then
            version=${GITHUB_REF_NAME#wine4office-v}
            tagged_release=true
          elif [[ $GITHUB_REF == refs/tags/0.*.* ]]; then
            [[ $GITHUB_REF_NAME =~ ^0\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
              echo "Unsupported numeric release tag: $GITHUB_REF_NAME" >&2
              exit 1
            }
            version=$GITHUB_REF_NAME
            tagged_release=true
          else
            version="0.0.0-${GITHUB_SHA:0:12}"
          fi
          [[ $version =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$ ]]
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          if [[ -n ${REQUESTED_RELEASE_CHANNEL:-} ]]; then
            channel=$REQUESTED_RELEASE_CHANNEL
          elif [[ $prerelease == true ]]; then
            channel=prerelease
          else
            channel=$DEFAULT_RELEASE_CHANNEL
          fi
          [[ $channel =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tagged_release=$tagged_release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Test verified curl installer
        run: tools/wine4office-manager/tests/test_curl_install.sh
      - name: Test release archive packaging
        run: tools/wine4office-manager/tests/test_release_artifacts.sh
      - name: Test OAuth helper source contracts
        run: python3 programs/wine4officeauth/tests/test_authorize_url.py
      - name: Test canonical Wine build contract
        run: tools/wine-build-env/tests/test_build_contract.sh
      - name: Test AppImage packaging contract
        run: tools/wine4office-manager/packaging/distribution/tests/test-package-builders.sh appimage

      - name: Configure and build Wine4Office
        env:
          WINE4OFFICE_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: tools/wine-build-env/run-build-container.sh full "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/stage"

      - name: Verify Wine4Office version branding
        run: |
          expected='wine4office-${{ steps.version.outputs.version }} (Wine '
          actual=$(stage/opt/wine4office/bin/wine --version)
          [[ $actual == "$expected"*')' ]] || {
            echo "Unexpected Wine version: $actual" >&2
            exit 1
          }

      - name: Bundle Wine Gecko and Mono
        shell: bash
        run: |
          set -euo pipefail
          gecko_version=2.47.4
          gecko_dir="$GITHUB_WORKSPACE/stage/opt/wine4office/share/wine/gecko"
          mkdir -p "$gecko_dir"
          curl --fail --location --retry 3 --show-error \
            --output "$gecko_dir/wine-gecko-${gecko_version}-x86.msi" \
            "https://dl.winehq.org/wine/wine-gecko/${gecko_version}/wine-gecko-${gecko_version}-x86.msi"
          curl --fail --location --retry 3 --show-error \
            --output "$gecko_dir/wine-gecko-${gecko_version}-x86_64.msi" \
            "https://dl.winehq.org/wine/wine-gecko/${gecko_version}/wine-gecko-${gecko_version}-x86_64.msi"
          sha256sum --check <<EOF
          26cecc47706b091908f7f814bddb074c61beb8063318e9efc5a7f789857793d6  $gecko_dir/wine-gecko-${gecko_version}-x86.msi
          e590b7d988a32d6aa4cf1d8aa3aa3d33766fdd4cf4c89c2dcc2095ecb28d066f  $gecko_dir/wine-gecko-${gecko_version}-x86_64.msi
          EOF
          mono_version=11.3.0
          mono_dir="$GITHUB_WORKSPACE/stage/opt/wine4office/share/wine/mono"
          mkdir -p "$mono_dir"
          curl --fail --location --retry 3 --show-error \
            --output "$mono_dir/wine-mono-${mono_version}-x86.msi" \
            "https://dl.winehq.org/wine/wine-mono/${mono_version}/wine-mono-${mono_version}-x86.msi"
          echo "df2dfc1665c2511882e7cabd56eafd0c0a3d94e5a7e86f969277f6c189d418d3  $mono_dir/wine-mono-${mono_version}-x86.msi" \
            | sha256sum --check

      - name: Build standalone Wine4OfficeManager
        run: |
          set -euo pipefail
          python3 -m venv manager-qt-venv
          manager-qt-venv/bin/python -m pip install --disable-pip-version-check \
            -r tools/wine4office-manager/requirements-build.txt
          PYTHON="$PWD/manager-qt-venv/bin/python" \
            tools/wine4office-manager/packaging/build-qt-binary.sh \
            build/manager/Wine4OfficeManager \
            '${{ steps.version.outputs.version }}' \
            '${{ steps.version.outputs.channel }}'
          QT_QPA_PLATFORM=offscreen WINE4OFFICE_MANAGER_ROOT="$PWD/tools/wine4office-manager" \
            build/manager/Wine4OfficeManager --smoke-test

      - name: Package separate release artifacts
        env:
          TAGGED_RELEASE: ${{ steps.version.outputs.tagged_release }}
        run: |
          set -euo pipefail
          release_base_url=$CONFIGURED_RELEASE_BASE_URL
          if [[ $TAGGED_RELEASE == true ]]; then
            tagged_release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
            if [[ $release_base_url == "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download" ]]; then
              release_base_url=$tagged_release_url
            fi
          fi
          tools/wine4office-manager/packaging/build-release-artifacts.sh \
            stage/opt/wine4office \
            build/manager/Wine4OfficeManager \
            release \
            '${{ steps.version.outputs.version }}' \
            "$CONFIGURED_METADATA_URL" \
            "$release_base_url" \
            '${{ steps.version.outputs.channel }}' \
            "$(sed -n 's/^Wine version //p' VERSION)"
          install -m 0755 install.sh release/install.sh

      - name: Build distribution packages from release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          container_workspace=/work
          workspace_args=(--mount "type=bind,src=$GITHUB_WORKSPACE,dst=$container_workspace")
          if [[ -n ${HOSTNAME:-} ]] && docker container inspect "$HOSTNAME" >/dev/null 2>&1; then
            workspace_args=(--volumes-from "$HOSTNAME")
            container_workspace=$GITHUB_WORKSPACE
          fi
          manager="$container_workspace/release/Wine4OfficeManager-${version}-x86_64"
          runner="$container_workspace/release/wine4office-${version}-x86_64.tar.zst"
          docker run --rm --init \
            "${workspace_args[@]}" \
            --workdir "$container_workspace" ubuntu:24.04 bash -eu -c '
              apt-get update
              apt-get install -y --no-install-recommends dpkg-dev python3 zstd
              tools/wine4office-manager/packaging/distribution/build-deb.sh \
                "$1" "$2" "$3" apt wine4office "$4/release"
            ' -- "$manager" "$runner" "$version" "$container_workspace"
          docker run --rm --init \
            "${workspace_args[@]}" \
            --workdir "$container_workspace" fedora:latest bash -eu -c '
              dnf install -y python3 rpm-build tar zstd
              tools/wine4office-manager/packaging/distribution/build-rpm.sh \
                "$1" "$2" "$3" dnf wine4office "$4/release"
            ' -- "$manager" "$runner" "$version" "$container_workspace"
          python3 tools/wine4office-manager/packaging/distribution/generate-community-packages.py \
            release/release.json release/community
          tar -C release/community --sort=name --mtime=@0 --owner=0 --group=0 \
            --numeric-owner -czf "release/wine4office-${version}-aur.tar.gz" aur
          tar -C release/community --sort=name --mtime=@0 --owner=0 --group=0 \
            --numeric-owner -czf "release/wine4office-${version}-nix.tar.gz" nix

      - name: Build and smoke-test AppImage
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          tool="$RUNNER_TEMP/appimagetool-uruntime-x86_64.AppImage"
          runtime="$RUNNER_TEMP/uruntime-appimage-squashfs-lite-x86_64"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --show-error \
            --output "$tool" \
            https://github.com/pkgforge-dev/appimagetool-uruntime/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "4cfda236f46c425aef5bfe397c572663fe1bf7d0a8f62fd31197bad37438c1ca  $tool" \
            | sha256sum --check
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --show-error \
            --output "$runtime" \
            https://github.com/VHSgunzo/uruntime/releases/download/v0.6.1/uruntime-appimage-squashfs-lite-x86_64
          echo "e5463fa896fc583cab3b03e498fde5d311b6661bb6e184797081dfdb863bab82  $runtime" \
            | sha256sum --check
          chmod 0755 "$tool"
          APPIMAGETOOL="$tool" APPIMAGE_RUNTIME="$runtime" \
            tools/wine4office-manager/packaging/distribution/build-appimage.sh \
              "release/Wine4OfficeManager-${version}-x86_64" \
              "release/wine4office-${version}-x86_64.tar.zst" \
              release/release.json release/install.sh release

          appimage="$GITHUB_WORKSPACE/release/Wine4Office-${version}-x86_64.AppImage"
          test_home=$(mktemp -d)
          APPIMAGE_EXTRACT_AND_RUN=1 HOME="$test_home" \
          XDG_DATA_HOME="$test_home/.local/share" \
          WINE4OFFICE_HOME="$test_home/.local/share/wine4office" \
          WINE4OFFICE_BIN_HOME="$test_home/.local/bin" \
            "$appimage" --appimage-install-only
          mv "$appimage" "$appimage.after-install"
          QT_QPA_PLATFORM=offscreen \
            "$test_home/.local/share/wine4office/bin/Wine4OfficeManager" --smoke-test
          "$test_home/.local/share/wine4office/runner/bin/wine" --version \
            | grep -Fx "wine4office-${version} (Wine $(sed -n 's/^Wine version //p' VERSION))"
          mv "$appimage.after-install" "$appimage"

      - name: Build testable static repository trees
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          mkdir -p release/repositories
          deb=$(find "$GITHUB_WORKSPACE/release" -maxdepth 1 -name 'wine4office_*_amd64.deb' -print -quit)
          rpm=$(find "$GITHUB_WORKSPACE/release" -maxdepth 1 -name 'wine4office-*.x86_64.rpm' -print -quit)
          test -n "$deb" && test -n "$rpm"
          container_workspace=/work
          workspace_args=(--mount "type=bind,src=$GITHUB_WORKSPACE,dst=$container_workspace")
          if [[ -n ${HOSTNAME:-} ]] && docker container inspect "$HOSTNAME" >/dev/null 2>&1; then
            workspace_args=(--volumes-from "$HOSTNAME")
            container_workspace=$GITHUB_WORKSPACE
          fi
          deb="$container_workspace/release/$(basename "$deb")"
          rpm="$container_workspace/release/$(basename "$rpm")"
          manager="$container_workspace/release/Wine4OfficeManager-${version}-x86_64"
          repositories="$container_workspace/release/repositories"
          docker run --rm --init \
            "${workspace_args[@]}" \
            --workdir "$container_workspace" ubuntu:24.04 bash -eu -c '
              apt-get update
              apt-get install -y --no-install-recommends apt-utils
              tools/wine4office-manager/packaging/distribution/build-apt-repository.sh \
                "$3/apt" stable "$1"
              printf "deb [trusted=yes] file:$3/apt stable main\n" \
                > /etc/apt/sources.list.d/wine4office-test.list
              apt-get update
              apt-get install -y --no-install-recommends wine4office
              cmp /opt/wine4office/bin/Wine4OfficeManager "$2"
              useradd --create-home package-test
              runuser -u package-test -- env QT_QPA_PLATFORM=offscreen \
                /opt/wine4office/bin/Wine4OfficeManager --smoke-test
              runuser -u package-test -- \
                /opt/wine4office/runner/bin/wine --version
            ' -- "$deb" "$manager" "$repositories"
          docker run --rm --init \
            "${workspace_args[@]}" \
            --workdir "$container_workspace" fedora:latest bash -eu -c '
              dnf install -y createrepo_c
              tools/wine4office-manager/packaging/distribution/build-rpm-repository.sh \
                "$3" "$1"
              printf "%s\n" \
                "[wine4office-test]" \
                "name=Wine4Office test" \
                "baseurl=file://$3/rpm/x86_64" \
                "enabled=1" \
                "gpgcheck=0" \
                > /etc/yum.repos.d/wine4office-test.repo
              dnf install -y wine4office
              cmp /opt/wine4office/bin/Wine4OfficeManager "$2"
              useradd --create-home package-test
              runuser -u package-test -- env QT_QPA_PLATFORM=offscreen \
                /opt/wine4office/bin/Wine4OfficeManager --smoke-test
              runuser -u package-test -- \
                /opt/wine4office/runner/bin/wine --version
            ' -- "$rpm" "$manager" "$repositories"
          tar -C release/repositories --sort=name --mtime=@0 --owner=0 --group=0 \
            --numeric-owner -czf "release/wine4office-${version}-repositories-unsigned.tar.gz" .

      - name: Upload Wine4OfficeManager CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wine4OfficeManager-${{ steps.version.outputs.version }}-x86_64
          path: |
            release/Wine4OfficeManager-${{ steps.version.outputs.version }}-x86_64
            release/Wine4OfficeManager-${{ steps.version.outputs.version }}-x86_64.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload Wine CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine4office-${{ steps.version.outputs.version }}-x86_64
          path: |
            release/wine4office-${{ steps.version.outputs.version }}-x86_64.tar.zst
            release/wine4office-${{ steps.version.outputs.version }}-x86_64.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload release metadata and installer CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine4office-release-metadata-${{ steps.version.outputs.version }}
          path: |
            release/release.json
            release/install.sh
          if-no-files-found: error

      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: wine4office-distribution-packages-${{ steps.version.outputs.version }}
          path: |
            release/*.deb
            release/*.rpm
            release/Wine4Office-${{ steps.version.outputs.version }}-x86_64.AppImage
            release/Wine4Office-${{ steps.version.outputs.version }}-x86_64.AppImage.sha256
            release/wine4office-${{ steps.version.outputs.version }}-aur.tar.gz
            release/wine4office-${{ steps.version.outputs.version }}-nix.tar.gz
            release/wine4office-${{ steps.version.outputs.version }}-repositories-unsigned.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Publish tagged GitHub release
        if: steps.version.outputs.tagged_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAGGED_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          release_args=(--verify-tag --generate-notes)
          [[ $TAGGED_PRERELEASE == true ]] && release_args+=(--prerelease)
          artifacts=(
            "release/Wine4OfficeManager-${version}-x86_64"
            "release/Wine4OfficeManager-${version}-x86_64.sha256"
            "release/wine4office-${version}-x86_64.tar.zst"
            "release/wine4office-${version}-x86_64.tar.zst.sha256"
            "release/install.sh"
            "release/release.json"
            "release/"*.deb
            "release/"*.rpm
            "release/Wine4Office-${version}-x86_64.AppImage"
            "release/Wine4Office-${version}-x86_64.AppImage.sha256"
            "release/wine4office-${version}-aur.tar.gz"
            "release/wine4office-${version}-nix.tar.gz"
            "release/wine4office-${version}-repositories-unsigned.tar.gz"
          )
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              "${release_args[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --prerelease="$TAGGED_PRERELEASE"
          gh release upload "$GITHUB_REF_NAME" "${artifacts[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
